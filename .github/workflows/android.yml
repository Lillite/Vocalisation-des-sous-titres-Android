name: Verifier et compiler Android
on:
  workflow_dispatch:
  push:
    branches: [main, cinema-voix-v02]
    paths: ['app/**', 'core/**', 'tools/**', 'examples/**', '*.kts', 'gradle.properties', '.github/workflows/android.yml']
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Outils et place disque
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes) > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Controles, tests et compilation
        run: |
          python3 tools/check-project.py
          gradle --no-daemon --stacktrace :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Signature, permissions et provenance
        run: |
          set -euo pipefail
          mkdir -p build/verification
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee build/verification/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > build/verification/manifest.xml
          python3 tools/check-apk-manifest.py build/verification/manifest.xml
          sha256sum "$APK" > build/verification/apk-sha256.txt
          git rev-parse HEAD > build/verification/source-commit.txt
          git archive --format=zip HEAD -o build/verification/sources.zip
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests reels sur Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Conserver les resultats Android 35
        if: always()
        run: |
          mkdir -p build/verification/api35
          cp -r app/build/reports/androidTests app/build/outputs/androidTest-results build/verification/api35/ 2>/dev/null || true
      - name: Tests reels sur Android 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: test36
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-rapports-verification
          path: |
            core/build/reports/
            core/build/test-results/
            app/build/reports/
            app/build/outputs/androidTest-results/
            build/verification/
          retention-days: 14
      - name: APK seulement apres succes
        uses: actions/upload-artifact@v4
        with:
          name: SousTitresVoix-Cinema-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/verification/apk-sha256.txt
            build/verification/source-commit.txt
          if-no-files-found: error
          retention-days: 14
