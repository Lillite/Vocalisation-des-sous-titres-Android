name: Android — compilation et régressions
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preparer SDK et demonstration
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y ffmpeg >/dev/null
          fi
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes) >/dev/null
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          fi
          mkdir -p build/verification
          git rev-parse HEAD > build/verification/source-commit.txt
          git archive --format=zip --output=build/verification/sources-verifiees.zip HEAD
      - name: Controles structurels
        run: |
          python3 tools/check-project.py
          python3 tools/test-publish-verified-release.py
      - name: Tests JVM, lint et compilation debug
        shell: bash
        run: |
          set +e
          started_ns=$(python3 -c 'import time; print(time.time_ns())')
          printf '%s\n' "$started_ns" > build/verification/debug-started-ns.txt
          gradle --no-daemon --stacktrace --rerun-tasks --no-build-cache :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest > build/verification/debug-build-console.txt 2>&1
          result=$?
          tail -n 180 build/verification/debug-build-console.txt
          python3 tools/verify-test-results.py --reports core/build/test-results/test --expected-count 178 --sources core/src/test/kotlin --not-before-ns "$started_ns" --output build/verification/debug-core-test-summary.json
          core_result=$?
          python3 tools/verify-test-results.py --reports app/build/test-results/testDebugUnitTest --expected-count 238 --sources app/src/test/java --not-before-ns "$started_ns" --output build/verification/debug-app-test-summary.json
          app_result=$?
          # The release step reruns the core suite: retain the debug XML as evidence.
          cp -a core/build/test-results/test build/verification/debug-core-junit
          archive_result=$?
          if [[ "$result" != 0 ]]; then exit "$result"; fi
          if [[ "$core_result" != 0 ]]; then exit "$core_result"; fi
          if [[ "$app_result" != 0 ]]; then exit "$app_result"; fi
          exit "$archive_result"
      - name: Verifier le manifeste et la signature debug
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > build/verification/debug-signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > build/verification/debug-manifest.xml
          python3 tools/check-apk-manifest.py build/verification/debug-manifest.xml
          sha256sum "$APK" > build/verification/debug-apk.sha256
      - name: Creer une signature de validation ephemere
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import secrets
          import subprocess

          directory = Path(os.environ['RUNNER_TEMP']) / 'tts-ci-signing'
          directory.mkdir(mode=0o700)
          key = directory / 'validation.p12'
          password = secrets.token_urlsafe(48)
          print(f'::add-mask::{password}', flush=True)
          environment = os.environ.copy()
          environment['TTS_CI_VALIDATION_PASSWORD'] = password
          subprocess.run([
              'keytool', '-genkeypair', '-storetype', 'PKCS12', '-keystore', str(key),
              '-alias', 'ci-validation', '-keyalg', 'RSA', '-keysize', '3072',
              '-sigalg', 'SHA256withRSA', '-validity', '2',
              '-dname', 'CN=Ephemeral CI validation,OU=Validation,O=Subtitles Voice,C=FR',
              '-storepass:env', 'TTS_CI_VALIDATION_PASSWORD',
              '-keypass:env', 'TTS_CI_VALIDATION_PASSWORD',
          ], env=environment, check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          key.chmod(0o600)
          properties = directory / 'signing.properties'
          properties.write_text(
              f'storeFile={key}\nstorePassword={password}\n'
              f'keyAlias=ci-validation\nkeyPassword={password}\n', encoding='utf-8')
          properties.chmod(0o600)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as stream:
              stream.write(f'SUBTITRES_SIGNING_PROPERTIES={properties}\n')
          PY
      - name: Tous les tests JVM, lint et compilation release
        shell: bash
        run: |
          set +e
          started_ns=$(python3 -c 'import time; print(time.time_ns())')
          printf '%s\n' "$started_ns" > build/verification/release-started-ns.txt
          gradle --no-daemon --stacktrace --rerun-tasks --no-build-cache -PverifyRelease=true :core:test :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:assembleReleaseAndroidTest > build/verification/release-build-console.txt 2>&1
          result=$?
          tail -n 180 build/verification/release-build-console.txt
          python3 tools/verify-test-results.py --reports core/build/test-results/test --expected-count 178 --sources core/src/test/kotlin --not-before-ns "$started_ns" --output build/verification/release-core-test-summary.json
          core_result=$?
          python3 tools/verify-test-results.py --reports app/build/test-results/testReleaseUnitTest --expected-count 238 --sources app/src/test/java --not-before-ns "$started_ns" --output build/verification/release-app-test-summary.json
          app_result=$?
          if [[ "$result" != 0 ]]; then exit "$result"; fi
          if [[ "$core_result" != 0 ]]; then exit "$core_result"; fi
          exit "$app_result"
      - name: Verifier la paire release, les permissions et les signatures
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          TEST_APK=app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          for kind in app test; do
            if [[ "$kind" == app ]]; then file="$APK"; else file="$TEST_APK"; fi
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$file" > "build/verification/signature-$kind.txt"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$file" > "build/verification/alignment-$kind.txt"
            "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$file" > "build/verification/manifest-$kind.xml"
          done
          python3 tools/check-apk-manifest.py build/verification/manifest-app.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          evidence = Path('build/verification')
          certificates = []
          for kind in ('app', 'test'):
              values = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)$',
                                  (evidence / f'signature-{kind}.txt').read_text(), re.M)
              assert len(values) == 1, f'Expected one verified signer for {kind}: {values}'
              certificates.append(values[0].lower())
          assert certificates[0] == certificates[1], 'Application and instrumentation must share the same signer'
          ns = '{http://schemas.android.com/apk/res/android}'
          application = ET.parse(evidence / 'manifest-app.xml').getroot()
          assert application.find('application').get(ns + 'debuggable', 'false') == 'false'
          tests = ET.parse(evidence / 'manifest-test.xml').getroot()
          assert tests.get('package') == 'fr.soustitresvoix.player.translation.test'
          instrumentation = tests.findall('instrumentation')
          assert len(instrumentation) == 1
          assert instrumentation[0].get(ns + 'targetPackage') == 'fr.soustitresvoix.player.translation'
          assert instrumentation[0].get(ns + 'name') == 'androidx.test.runner.AndroidJUnitRunner'
          (evidence / 'validation-signer-sha256.txt').write_text(certificates[0] + '\n')
          print('Verified non-debuggable release, matching test signer and stable instrumentation target')
          PY
          sha256sum "$APK" "$TEST_APK" > build/verification/apk-pair.sha256
      - name: Preparer emulateur jetable avec KVM
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          kvm_diagnostics() {
            local phase="$1"
            {
              date --utc --iso-8601=ns
              nproc || true
              lscpu || true
              cat /proc/meminfo || true
              udevadm --version || true
              id || true
              ls -l /dev/kvm || true
              stat -Lc 'type=%F mode=%a uid=%u gid=%g owner=%U group=%G major=%t minor=%T' /dev/kvm || true
              if test -r /dev/kvm; then echo 'readable=true'; else echo 'readable=false'; fi
              if test -w /dev/kvm; then echo 'writable=true'; else echo 'writable=false'; fi
            } 2>&1 | tee "build/verification/kvm-$phase.txt"
          }
          trap 'result=$?; kvm_diagnostics after; exit "$result"' EXIT
          kvm_diagnostics before
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger only queues events; wait for udev before checking the new permissions.
          if ! sudo udevadm settle --timeout=30; then
            echo '::error::udev synchronization failed (timeout limit: 30 seconds).' >&2
            exit 1
          fi
          if ! test -r /dev/kvm; then
            echo '::error::The runner cannot read /dev/kvm after udev synchronization.' >&2
            exit 1
          fi
          if ! test -w /dev/kvm; then
            echo '::error::The runner cannot write /dev/kvm after udev synchronization.' >&2
            exit 1
          fi
          df -h /
      - name: Deux passages complets des 87 tests release sur Android 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          # The tests use their own TTS fixture and no Google service. The AOSP
          # image avoids GMS first-boot downloads that caused a SystemUI ANR.
          target: default
          arch: x86_64
          profile: pixel_2
          # Boot ANR showed CPU pressure before installation; use all four runner vCPUs.
          cores: 4
          ram-size: 2048M
          disk-size: 2048M
          disable-animations: true
          emulator-options: -accel on -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/run-release-device-tests.sh
      - name: Verifier les artefacts apres les deux passages
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check build/verification/apk-pair.sha256
          git diff --exit-code
          git diff --cached --exit-code
      - name: Supprimer la cle de validation ephemere
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/tts-ci-signing"
      - name: Conserver preuves et sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-rapports-validation
          path: |
            build/verification/
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
          retention-days: 14
          if-no-files-found: warn
      - name: Paire APK testee seulement apres tous les controles
        uses: actions/upload-artifact@v4
        with:
          # This transient signer is for validation. The exact tested app APK
          # is later re-signed locally, with every non-signature payload checked.
          name: SousTitresVoix-release-validation
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            build/verification/apk-pair.sha256
            build/verification/validation-signer-sha256.txt
            build/verification/source-commit.txt
          retention-days: 14
          if-no-files-found: error
