name: APK 0.5.4-local — publication vérifiée

on:
  push:
    branches: ['release-upload/v0.5.4-local']
    paths: ['release-upload/**']

permissions:
  contents: read

concurrency:
  group: publish-apk-v0.5.4-local
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Lillite/Vocalisation-des-sous-titres-Android' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/release-upload/v0.5.4-local' &&
      !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Préparer uniquement les outils de vérification Android
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" || ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes) >/dev/null
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
          fi
      - name: Vérifier la provenance puis publier le fichier déjà signé
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/publish-verified-release.py
