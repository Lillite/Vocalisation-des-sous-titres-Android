name: Cinema - verifier et compiler
on:
  workflow_dispatch:
  push:
    branches: [cinema-0.2]
permissions:
  contents: read
concurrency:
  group: cinema-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cinema:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preparer SDK et demonstration
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ffmpeg >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes) >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          mkdir -p build/verification
          git rev-parse HEAD > build/verification/source-commit.txt
          git archive --format=zip --output=build/verification/sources-cinema.zip HEAD
      - name: Controles structurels
        run: python3 tools/check-project.py
      - name: Tests du noyau, lint et compilation
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest > build/verification/build-console.txt 2>&1
          result=$?
          tail -n 180 build/verification/build-console.txt
          exit "$result"
      - name: Verifier identite, permissions et signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee build/verification/signature.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > build/verification/manifest.xml
          python3 tools/check-apk-manifest.py build/verification/manifest.xml
          sha256sum "$APK" > build/verification/apk-sha256.txt
      - name: Preparer emulateur jetable
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          df -h /
      - name: Tests reels Android 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/run-device-tests.sh
      - name: Conserver preuves et sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cinema-rapports
          path: |
            build/verification/
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: warn
      - name: APK seulement apres tous les tests
        uses: actions/upload-artifact@v4
        with:
          name: SousTitresVoix-Cinema-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/verification/apk-sha256.txt
            build/verification/source-commit.txt
          retention-days: 14
          if-no-files-found: error
