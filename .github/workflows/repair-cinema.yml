name: Appliquer la correction Android verifiee
on:
  push:
    branches: [cinema-0.2]
    paths: ['tools/repair-cinema.patch', '.github/workflows/repair-cinema.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cinema-0.2
          fetch-depth: 0
      - name: Appliquer uniquement les corrections source versionnees
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = 'Lillite/Vocalisation-des-sous-titres-Android'
          test -f tools/repair-cinema.patch
          git merge-base --is-ancestor 7ae4bb251636f5a562a904319cb4ef80a73b5109 HEAD
          git apply --check tools/repair-cinema.patch
          git apply tools/repair-cinema.patch
          git add app/src/main/java/fr/soustitresvoix/player/MainActivity.kt app/src/main/java/fr/soustitresvoix/player/AndroidSpeech.kt app/src/androidTest/java/fr/soustitresvoix/player/FixtureSpeechService.kt app/src/androidTest/java/fr/soustitresvoix/player/FixtureSpeechService.java
          git rm tools/repair-cinema.patch
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Corriger le decor Android 16 et rendre le moteur vocal de test autonome'
          git push origin HEAD:cinema-0.2
          git rev-parse HEAD
